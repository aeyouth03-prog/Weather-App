<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-image: url(https://bit.ly/4bcK1Hc);
      background-repeat: no-repeat;
      background-size: cover;
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
      height: 100vh;
    }

    main {
      background-color: rgba(227, 193, 173, 0.85);
      position: relative;
      top: 30%;
      border: 1px solid;
      border-radius: 5px;
      min-width: 540px;
      max-width: 50%;
      margin: auto;
      padding: 2em;
    }

    h1 {
      margin-bottom: 20px;
    }

    #weather-wrapper {
      display: flex;
      flex-direction: column;
      place-items: center;
      justify-content: space-between;
    }

    #weather-search {
      display: flex;
      width: 50%;
    }

    #search {
      border-radius: 5px 0 0 5px;
      border: none;
      padding: 10px;
      font-size: 16px;
      width: 70%;
      height: 42px;
    }

    #submit {
      border-radius: 0 5px 5px 0;
      padding: 10px;
      font-size: 16px;
      width: 5em;
      cursor: pointer;
    }

    #weather-data {
      background-color: rgba(255, 255, 255, 0.85);
      border-radius: 5px;
      padding: 1.5em;
      margin-top: 20px;

      text-align: center;
      align-items: center;
      gap: 12px;
    }

    #weather-data > img {
      border-radius: 50%;
      background-color: lightskyblue;
    }
  </style>
</head>

<body>
  <main>
    <section id="weather-wrapper">
      <h1>Weather App</h1>

      <div id="weather-search">
        <input id="search" type="text" placeholder="Search by city" />
        <input id="submit" type="submit" onclick="fetchWeather()" value="Search" />
      </div>

      <div id="weather-data" style="display: none;"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
